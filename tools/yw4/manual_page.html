<!DOCTYPE html>
<!-- The game's manual in one page, in the site's look (decision 0082's crash survey, 2026-11-19, owner's option A):
     the site's top bar, icon, patterned background and light / dark switch (docs/site.css, docs/index.html).
     This template is ours; tools/yw4/manual.py fills the markers below with the player's own manual pages (from their
     NSP or XCI) and the site's icon and patterns (embedded, so it works offline), on their PC, as
     work/manual/manual.html. The game's text never comes from or goes to the repo. -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Manual · YW4 Recomp</title>
<link rel="icon" type="image/png" href="{{ICON}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script>
/* the theme before the page draws, as on the site: the reader's choice if kept, else the system's */
try { const t = localStorage.getItem('yw4-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* the site's colours (docs/site.css) */
:root {
  --bg: #fffdf8; --pattern: url("{{PATTERN}}"); --card: #ffffff; --ink: #2b2140; --ink-2: #6b5d82; --line: #ece5f3;
  --accent: #e8336d; --accent-ink: #b81f50; --violet: #4b2d7f; --on-violet: #fff;
  --soft: #f6f1fb; --warn-bg: #fff4d6; --warn-ink: #7a5600; --top: #fffffff2; --shade: #2b214014;
  --display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic UI", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15111d; --pattern: url("{{PATTERN_DARK}}"); --card: #1f1929; --ink: #ece6f6; --ink-2: #a99cc0; --line: #2f2640;
    --accent: #ff6b97; --accent-ink: #ff8fb0; --violet: #8e6ad8; --soft: #241d31; --warn-bg: #2e2614; --warn-ink: #f3cf73;
    --top: #15111df0; --shade: #00000055; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15111d; --pattern: url("{{PATTERN_DARK}}"); --card: #1f1929; --ink: #ece6f6; --ink-2: #a99cc0; --line: #2f2640;
  --accent: #ff6b97; --accent-ink: #ff8fb0; --violet: #8e6ad8; --soft: #241d31; --warn-bg: #2e2614; --warn-ink: #f3cf73;
  --top: #15111df0; --shade: #00000055; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 78px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--bg) var(--pattern) 0 0 / 280px 280px; color: var(--ink); font: 400 16px/1.75 var(--body); }
a { color: var(--accent-ink); }
/* the site's top bar */
.site-top { position: sticky; top: 0; z-index: 20; background: var(--top); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.site-top .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; gap: 18px; height: 62px; }
.site-top .brand { display: flex; align-items: center; gap: 10px; font: 900 1.05rem/1 var(--display); color: var(--ink); text-decoration: none; }
.site-top .brand img { width: 34px; height: 34px; border-radius: 9px; }
.site-top .what { font: 700 .95rem/1 var(--display); color: var(--ink-2); padding-left: 16px; border-left: 1px solid var(--line); }
.site-top .tools { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.site-top .iconbtn { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--ink); cursor: pointer; text-decoration: none; padding: 0; }
.site-top .iconbtn:hover { background: var(--soft); }
.site-top .iconbtn svg { width: 19px; height: 19px; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .7s; animation-timing-function: ease-in-out; }
@media (prefers-reduced-motion: reduce) { ::view-transition-old(root), ::view-transition-new(root) { animation: none; } }
#theme .sun { display: none; }
:root[data-theme="dark"] #theme .sun { display: block; }
:root[data-theme="dark"] #theme .moon { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) #theme .sun { display: block; }
  :root:not([data-theme="light"]) #theme .moon { display: none; }
}
/* the manual */
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; max-width: 1180px; margin: 0 auto; padding: 24px 20px; }
nav { position: sticky; top: 86px; align-self: start; max-height: calc(100vh - 110px); overflow: auto; padding: 10px;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
nav ol { list-style: none; margin: 0; padding: 0; counter-reset: p; }
nav li { counter-increment: p; }
nav a { display: flex; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 10px; text-decoration: none;
  color: var(--ink); font: 700 14px/1.4 var(--display); }
nav a::before { content: counter(p); min-width: 1.5em; color: var(--ink-2); font-weight: 800; }
nav a:hover { background: var(--soft); }
nav a.on { background: var(--violet); color: var(--on-violet); }
nav a.on::before { color: var(--on-violet); }
.note { margin: 0 0 22px; padding: 14px 18px; border-radius: 14px; background: var(--warn-bg); color: var(--warn-ink); font-size: 15px; }
.page { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 26px 30px; margin-bottom: 26px;
  box-shadow: 0 2px 10px var(--shade); }
.page > h1 { margin: 0 0 14px; font: 900 28px/1.3 var(--display); color: var(--violet); }
.sec { margin: 0 0 26px; }
.sec h2 { margin: 22px 0 10px; padding: 6px 14px; border-radius: 10px; background: var(--soft); font: 800 20px/1.4 var(--display); }
.sec h3 { margin: 18px 0 8px; padding-left: 12px; border-left: 4px solid var(--accent); font: 700 17px/1.4 var(--display); }
p { margin: 0 0 10px; }
.mb10 { margin-bottom: 10px; } .mb20 { margin-bottom: 20px; } .mb30 { margin-bottom: 30px; } .mb40 { margin-bottom: 40px; }
ul { margin: 0 0 10px; padding-left: 0; list-style: none; }
.notice { color: var(--ink-2); font-size: 14px; }
.notice__wrap { margin: 14px 0; padding: 14px 18px; border: 2px dashed var(--line); border-radius: 14px; }
.column_ttl { font: 700 16px/1.4 var(--display); color: var(--accent-ink); margin-bottom: 6px; }
.flxBox { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 14px; }
.flxBox > * { flex: 1 1 0; min-width: 0; }
.flxBox > img.deco { flex: 0 0 auto; max-width: 42%; }
img { max-width: 100%; height: auto; border-radius: 8px; }
.icon__img img { height: 1.6em; width: auto; vertical-align: middle; border-radius: 0; }
.icon__list { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.icon__list--item { display: flex; gap: 8px; align-items: center; }
.icon__list.clm2 .icon__list--item { width: calc(50% - 18px); }
.icon__list.clm3 .icon__list--item { width: calc(33.3% - 18px); }
.icon__list.clm4 .icon__list--item { width: calc(25% - 18px); }
.imgBox { text-align: center; margin: 10px 0 18px; }
.num__dl { margin: 0; }
.num__dl dt { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 4px; border: 1px solid var(--violet); border-radius: 12px; }
.num__dl dt .num { padding: 4px 11px; border-radius: 9px; background: var(--violet); color: var(--on-violet); font-weight: 800; }
.num__dl dt .ttl { color: var(--violet); font: 800 17px/1.4 var(--display); }
.num__dl dd { margin: 8px 6px 10px; }
.num_list--item { text-indent: -1.3em; padding-left: 1.3em; }
table { width: 100%; border-collapse: collapse; margin: 8px 0 14px; font-size: 15px; }
th, td { padding: 8px 12px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
th { background: var(--soft); white-space: nowrap; font-weight: 700; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; max-height: none; }
  .flxBox { flex-direction: column; } .flxBox > img.deco { max-width: 100%; }
  .site-top .what { display: none; }
}
</style>
</head>
<body>
<header class="site-top">
  <div class="wrap">
    <span class="brand"><img src="{{ICON}}" alt="" width="34" height="34">YW4 Recomp</span>
    <span class="what">Manual</span>
    <div class="tools">
      <button class="iconbtn" id="theme" type="button" aria-label="Dark mode"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></button>
      <a class="iconbtn" href="https://github.com/ILFforever/YW4Recomp" aria-label="The project on GitHub"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg></a>
    </div>
  </div>
</header>
<div class="layout">
<nav aria-label="Pages"><ol>
{{NAV}}
</ol></nav>
<main>
<p class="note">The game's own manual, from your game files. Your browser's Translate button reads it in English.</p>
{{PAGES}}
</main>
</div>
<script>
/* the list follows the page being read */
const links = [...document.querySelectorAll('nav a')];
const seen = new IntersectionObserver(es => {
  for (const e of es) if (e.isIntersecting)
    links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id));
}, { rootMargin: '-90px 0px -70% 0px' });
document.querySelectorAll('.page').forEach(p => seen.observe(p));
/* the site's theme switch: the other theme than the one showing, kept for next time */
(() => {
  const btn = document.getElementById('theme'), root = document.documentElement;
  const dark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const label = () => btn.setAttribute('aria-label', dark() ? 'Light mode' : 'Dark mode');
  label();
  const flip = () => {
    root.dataset.theme = dark() ? 'light' : 'dark';
    try { localStorage.setItem('yw4-theme', root.dataset.theme); } catch (e) {}
    label();
  };
  btn.addEventListener('click', () => {
    if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(flip);
    else flip();
  });
})();
</script>
</body>
</html>
