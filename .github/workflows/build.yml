# Build check: does our own code still compile and pass its tests, on Linux and on Windows, and does the
# launcher build? Runs on every push to master, every version tag and every pull request.
#
# What it can't check: the game itself. Translating, linking and running it needs a player's own game files,
# which are never on GitHub (CLAUDE.md rule 1). So this compiles the runtime, musl's math and our shaders
# (python -m recomp.ci) and runs the tests on made-up data (tests/); a green mark means "our code compiles on
# both systems", not "the game plays".
name: Build check

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The compiler and glslang a Linux player without them gets (decision 0083: Zig 0.17.1's Clang 22 and Khronos'
  # glslang, pinned by SHA-256), the Bazzite / SteamOS path; no apt, whose mirror once held a run up 12 minutes
  # (2026-11-19). The distributions' own Clang 19 has its own weekly workflow (linux-system-clang.yml).
  linux:
    name: Linux (our tools, Clang 22)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/linux-tools
          key: linux-tools-${{ hashFiles('tools/yw4/deps.py') }}
      - name: Compiler and glslang (our downloads)
        run: |
          python3 - <<'EOF'
          import os
          from pathlib import Path
          from tools.yw4 import deps
          tools = Path(os.environ["RUNNER_TEMP"]) / "linux-tools"
          cc, glslang = deps.fetch_zig(tools), deps.fetch_glslang_linux(tools)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"CC={cc}\n")
          with open(os.environ["GITHUB_PATH"], "a") as f:  # ahead of anything the image has
              f.write(f"{glslang.parent}\n")
          print(cc, glslang)
          EOF
      - name: Compile the runtime, musl's math and our shaders
        run: python3 -m recomp.ci
      - name: Tests
        run: python3 -m unittest discover -s tests -t .
      - name: Decision records
        run: python3 -m tools.dev.decisions --check
      # rule 1's second line of defence (game-data signatures, oversized files, user names in paths) on every tracked
      # file: the pre-commit hook is optional, so a commit made without it is caught here
      - name: No game data or user names in the repo
        run: python3 -m tools.yw4.guard --all

  windows:
    name: Windows (llvm-mingw)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the pinned compiler and SDKs (tools/yw4/deps.py: exact versions, SHA-256 checked); kept between runs
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\yw4
          key: deps-${{ hashFiles('tools/yw4/deps.py') }}
      - name: Compiler (the one players' builds use)
        shell: pwsh
        run: |
          python -m tools.yw4.deps --toolchain "$env:RUNNER_TEMP\yw4"
          "CC=$env:RUNNER_TEMP\yw4\llvm-mingw\bin\clang.exe" >> $env:GITHUB_ENV
      - name: Compile the runtime and musl's math (with the FSR, DLSS and Streamline headers)
        shell: pwsh
        run: python -m recomp.ci --work "$env:RUNNER_TEMP\yw4\work"
      - name: Tests
        run: python -m unittest discover -s tests -t .

  launcher:
    name: Launcher (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - name: Build
        run: cargo build --locked
      - name: Tests
        run: cargo test --locked
