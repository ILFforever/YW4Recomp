[package]
name = "yw4-recomp-launcher"
version = "0.1.0"
description = "YW4 Recomp launcher: sets up the game from the player's own dump, builds it and starts it"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
sha2 = "0.10"
toml = "0.8"

[profile.release]
# a small launcher: it only shows screens and runs the build steps
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Windows' own API, already in the build through Tauri: free disk space, starting tools without a console window
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
