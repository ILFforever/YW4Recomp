[package]
name = "yw4-recomp-launcher"
version = "1.0.1"
description = "YW4 Recomp launcher: sets up the game from the player's own dump, builds it and starts it"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
sha2 = "0.10"
toml = "0.8"

[profile.release]
# a small launcher: it only shows screens and runs the build steps. Thin LTO over 16 units, not full LTO on 1:
# packaging after a launcher change went from ~163 s of Rust compile to ~47 s (2026-11-13, owner's 16 threads),
# for 8.9 MB instead of 8.0 MB; the launcher's own speed doesn't matter
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true

# Windows' own API, already in the build through Tauri: free disk space, starting tools without a console window
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Diagnostics_Debug"] }
