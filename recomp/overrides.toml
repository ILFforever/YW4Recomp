# Recompiled functions replaced by native runtime code (decision 0016).
#
# The function at the symbol's address keeps its name (s_<offset> / f_<offset>) but its
# body becomes a call to `native`, so every caller reaches the native code: direct calls,
# calls through the PLT, function pointers. Natives follow the AArch64 calling convention
# on the CPUState (arguments in x0-x7 / v0-v7, result in x0 / v0). Only symbol names live
# here, never game code. Each entry says why it is native.

# NVN, the graphics API, is implemented natively on Vulkan (decision 0005). The sdk's own
# NVN driver, which writes Maxwell GPU commands through nvdrv, never runs.
[[override]]
module = "sdk"
symbol = "nvnBootstrapLoader"
native = "yw4_nvn_BootstrapLoader"
why = "NVN's only entry point: returns our native NVN functions"

[[override]]
module = "sdk"
symbol = "_ZN2nv18InitializeGraphicsEPvm"
native = "yw4_nv_InitializeGraphics"
why = "nv::InitializeGraphics(memory, size) starts the sdk's GPU driver (nvdrv); our NVN needs no driver"

[[override]]
module = "sdk"
symbol = "_ZN2nv16FinalizeGraphicsEv"
native = "yw4_nv_FinalizeGraphics"
why = "the counterpart of nv::InitializeGraphics"

# nn::vi, the display: on the Switch the NVN driver presents through vi's layers and the
# Android-style "binder" buffer queue behind them. Our NVN presents itself, so the game's
# display calls only need to hand back objects and the vsync event (decision 0017).
[[override]]
module = "sdk"
symbol = "_ZN2nn2vi10InitializeEv"
native = "yw4_vi_Initialize"
why = "nn::vi::Initialize: connects to the display services, which our NVN doesn't use"

[[override]]
module = "sdk"
symbol = "_ZN2nn2vi8FinalizeEv"
native = "yw4_vi_Finalize"
why = "counterpart of nn::vi::Initialize"

[[override]]
module = "sdk"
symbol = "_ZN2nn2vi18OpenDefaultDisplayEPPNS0_7DisplayE"
native = "yw4_vi_OpenDefaultDisplay"
why = "a display object for the calls below"

[[override]]
module = "sdk"
symbol = "_ZN2nn2vi12CloseDisplayEPNS0_7DisplayE"
native = "yw4_vi_CloseDisplay"
why = "counterpart of OpenDefaultDisplay"

[[override]]
module = "sdk"
symbol = "_ZN2nn2vi11CreateLayerEPPNS0_5LayerEPNS0_7DisplayEii"
native = "yw4_vi_CreateLayer"
why = "a layer object: on the Switch, the compositor surface NVN's window presents to"

[[override]]
module = "sdk"
symbol = "_ZN2nn2vi12DestroyLayerEPNS0_5LayerE"
native = "yw4_vi_DestroyLayer"
why = "counterpart of CreateLayer"

[[override]]
module = "sdk"
symbol = "_ZN2nn2vi15GetNativeWindowEPPvPNS0_5LayerE"
native = "yw4_vi_GetNativeWindow"
why = "the handle the game passes to nvnWindowBuilderSetNativeWindow; our NVN doesn't look inside"

[[override]]
module = "sdk"
symbol = "_ZN2nn2vi20GetDisplayVsyncEventEPNS_2os15SystemEventTypeEPNS0_7DisplayE"
native = "yw4_vi_GetDisplayVsyncEvent"
why = "the vsync event, signalled at 60 Hz by a host thread"

# Guest functions native code calls, by name (yw4_guest_symbol() in the runtime).
[[guest_symbol]]
module = "sdk"
symbol = "_ZN2nn2os33AttachReadableHandleToSystemEventEPNS0_15SystemEventTypeEjbNS0_14EventClearModeE"

# nn::swkbd, the software keyboard: a library applet on the Switch, which we don't have.
# The call answers at once with a name (YW4_PLAYER_NAME, default "Nate").
[[override]]
module = "sdk"
symbol = "_ZN2nn5swkbd12ShowKeyboardEPNS0_6StringERKNS0_15ShowKeyboardArgE"
native = "yw4_swkbd_ShowKeyboard"
why = "nn::swkbd::ShowKeyboard launches the keyboard applet (CreateLibraryApplet), which has no host equivalent"

# nn::ec, the eShop: a library applet on the Switch, which we don't have. The game's
# "additional content" menu entry calls this; it returns at once, as if the shop were closed.
[[override]]
module = "sdk"
symbol = "_ZN2nn2ec24ShowShopAddOnContentListERKNS_7account10UserHandleE"
native = "yw4_ec_ShowShopAddOnContentList"
why = "nn::ec::ShowShopAddOnContentList opens the eShop applet; there is no shop to show"

# The C library's memory and string basics: the recompiled versions run the ARM code word
# by word; the host's are vectorised and give the same results (decision 0011's natives).
[[override]]
module = "sdk"
symbol = "memcpy"
native = "hle_libc_memcpy"
why = "hot in every frame (profile 2026-10-22); the host memcpy is many times faster"

[[override]]
module = "sdk"
symbol = "memmove"
native = "hle_libc_memmove"
why = "memcpy's overlapping sibling, same reason"

[[override]]
module = "sdk"
symbol = "memset"
native = "hle_libc_memset"
why = "same reason as memcpy"

[[override]]
module = "sdk"
symbol = "strlen"
native = "hle_libc_strlen"
why = "same reason as memcpy"

# Hooks: native code that runs before a recompiled function and may do its work instead
# (decision 0024). Game functions have no symbols, so a hook names its function by offset.
[[hook]]
module = "main"
offset = "0xa45890"
native = "yw4_hook_model_renderer"
why = "the model renderer; shadow layers (kind 1) can be drawn by our own pass (runtime/src/shadow.c)"

[[hook]]
module = "main"
offset = "0xa75e90"
native = "yw4_hook_submesh_draw"
why = "the model renderer's submesh draw; YW4_SHADOWS=check notes what the game draws (runtime/src/shadow.c)"

[[hook]]
module = "main"
offset = "0x7ed350"
native = "yw4_hook_cascade_end"
why = "the job that ends a shadow cascade: our pass is queued here, after the game's draws of the layer (runtime/src/shadow.c)"

[[hook]]
module = "main"
offset = "0x97f510"
native = "yw4_hook_camera_update"
why = "copies every camera's settings into the fields its projection is built from; widescreen sets the aspect there afterwards (runtime/src/widescreen.c)"

[[hook]]
module = "main"
offset = "0xa77390"
native = "yw4_hook_bones_a77390"
why = "skeleton local transforms -> matrices, the hottest game code; done natively, bit-identical (runtime/src/bones.c, decision 0036)"

[[hook]]
module = "main"
offset = "0xa79c00"
native = "yw4_hook_bones_a79c00"
why = "the same with a per-bone extra call (main+0xa7a530); done natively (runtime/src/bones.c, decision 0036)"

[[hook]]
module = "main"
offset = "0x802e40"
native = "yw4_hook_bloom"
why = "the engine's bloom (device, renderer): YW4_BLOOM=native draws our own in its place (runtime/src/bloom.c, decision 0037)"

[[hook]]
module = "main"
offset = "0x8007d0"
native = "yw4_hook_dof"
why = "the engine's distance blur (device, renderer): YW4_DOF_PASS=native draws our own in its place (runtime/src/dof.c, decision 0038)"
