# The one game build this project targets (CLAUDE.md rule 3).
# Hashes only. Filled in by `python -m tools.yw4.ingest --pin`.
# image_sha256 = SHA-256 of main's flat memory image (see docs/decisions/0002).

[main]
image_sha256 = "dcd40ec54d9d3bc17a0375475f3bf885d41654c8bb83251992b44b6f826f0b50"
build_id = "C7DAB27F22ACD2EDFA334AEEC30E57867AA60E59"

# The sdk module of the same build: native versions of sdk functions are checked against
# its own code (tools/yw4/sdkref.py, docs/decisions/0013).
[sdk]
image_sha256 = "0134ff06b7b4b6c5b515e7157b292c6b0ae6ed10db9766a13f27644e208182f5"
build_id = "FCF93A41B08C5193A1410D262602DC621617C56F"

# The application's title ID: add-on content (DLC) title IDs are this + 0x1000 + index.
[title]
application_id = "010086C00AF7C000"

# Add-on content (DLC) the game unlocks when found on boot (decision 0049): index (title ID - application ID -
# 0x1000) = SHA-256 of the add-on's content NCA. That file is the same for every owner (its name is the start of
# this hash); the NSP's ticket is not, so the whole NSP is never hashed. The versions are the latest ones.
