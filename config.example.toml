# Copy this file to config.local.toml (gitignored) and fill in your paths.
# Every path to a file you supplied lives here and nowhere else.
# Relative paths are resolved from the repo root.

[input]
# Folder holding your already-extracted ExeFS (main, main.npdm, rtld, sdk, subsdk*).
exefs_dir = ""
# Folder holding your already-extracted RomFS.
romfs_dir = ""
# Optional. Your own base-game and latest-update NSPs. If set, `python -m
# tools.yw4.extract` fills exefs_dir and romfs_dir from them (update applied).
base_nsp = ""
update_nsp = ""

[output]
# Where generated files go. Must stay gitignored and should NOT be inside a
# cloud-synced folder (OneDrive, Dropbox, Google Drive).
work_dir = "work"

[tools]
# Optional. Only needed to extract ExeFS/RomFS from your own NSPs.
hactool_exe = ""
# Folder holding your console's prod.keys and title.keys. Keep it outside the repo.
keys_dir = ""
# Optional. An ARM64 Linux machine (e.g. Raspberry Pi 5) that generates golden
# results for recompiler tests (decision 0004), reached over SSH with a key.
pi_host = ""   # e.g. "pi@192.168.1.49"
pi_key = ""    # private key file, e.g. "~/.ssh/yw4_pi"
# Host C compiler for the recompiler tests and generated code (default: gcc). Clang is
# preferred: it guarantees tail calls (musttail). The CC environment variable overrides it.
cc = ""        # e.g. "C:/tools/llvm-mingw-20261006-ucrt-x86_64/bin/clang.exe"
# GLSL -> SPIR-V compiler for the shaders (decision 0020). Empty: glslangValidator from
# the Vulkan SDK (VULKAN_SDK or PATH). A standalone Khronos glslang release also works.
glslang = ""   # e.g. "C:/tools/glslang-16.6.0/bin/glslang.exe"
# Optional. Only needed for the Ghidra and baseline steps.
# Ghidra 12.1.2 with the Switch loader installed (see docs/ghidra.md).
ghidra_dir = ""
emulator_exe = ""
